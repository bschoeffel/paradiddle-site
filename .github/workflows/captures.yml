name: captures
on:
  push:
    branches: [captures]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: mkdir -p out && node shot.js
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add out && git commit -m "Captures [skip ci]" && git push
