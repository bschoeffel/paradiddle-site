name: captures
on:
  push:
    branches: [captures]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          {
          echo "== TXT (resolveur public)"; dig +short TXT paradiddle.fr @8.8.8.8
          echo "== TXT (serveurs OVH)"; for ns in $(dig +short NS paradiddle.fr); do echo "-- $ns"; dig +short TXT paradiddle.fr @$ns; done
          } > out/dns.txt 2>&1
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add out && git commit -m "Vérif DNS [skip ci]" && git push
