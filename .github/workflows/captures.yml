name: captures
on:
  push:
    branches: [captures]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          {
          echo "== DNS www"; dig +short www.paradiddle.fr CNAME; dig +short www.paradiddle.fr A
          echo "== DNS apex"; dig +short paradiddle.fr A
          echo "== http://www"; curl -sI http://www.paradiddle.fr | head -5
          echo "== https://www"; curl -sI https://www.paradiddle.fr 2>&1 | head -5
          echo "== http://apex"; curl -sI http://paradiddle.fr | head -5
          echo "== https://apex"; curl -sI https://paradiddle.fr | head -3
          } > out/dns.txt 2>&1
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add out && git commit -m "Vérif DNS [skip ci]" && git push
